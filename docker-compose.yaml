services:
  api:
    build: .
    container_name: pmt_api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      SERVICE_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/appdb
      REDIS_STREAM_URL: redis://:redis@redis:6379/1
      STREAM_NAME: order.events
      CONSUMER_GROUP: order_service_v1
      STREAM_POLL_INTERVAL_MS: 1000
      LOG_LEVEL: INFO
      JSON_LOGS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_ENDPOINT_ENABLE_FALLBACK: "False"
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: pmt-bucket
      S3_ACCESS_KEY_ID: dev
      S3_SECRET_ACCESS_KEY: dev
      S3_PRICES_KEY: config/prices.json
      S3_ROLLUP_PREFIX: rollups/
      S3_CONNECT_TIMEOUT_S: 2
      S3_READ_TIMEOUT_S: 5
      PRICES_CACHE_TTL_S: 60
    volumes:
      # Bind-mount so --reload picks up edits.
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully

  db:
    image: postgres:18
    container_name: pmt_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pmt_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appdb"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    container_name: pmt_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass "redis"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/config.json
      -volume.max=100
      -master.volumeSizeLimitMB=100
      -master.volumePreallocate=false
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweeddata:/data
      - ./seaweedfs/config.json:/etc/seaweedfs/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  bucket-init:
    image: amazon/aws-cli:2.31.9
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        endpoint=http://seaweedfs:8333
        bucket=pmt-bucket
        if aws --endpoint-url "$$endpoint" s3api head-bucket --bucket "$$bucket" 2>/dev/null; then
          echo "bucket $$bucket already exists"
        else
          aws --endpoint-url "$$endpoint" s3 mb "s3://$$bucket"
        fi
        aws --endpoint-url "$$endpoint" s3api head-bucket --bucket "$$bucket"
        # Seed the catalog: without it, the first order dead-letters on a
        # missing price file, which is a confusing first experience.
        if aws --endpoint-url "$$endpoint" s3api head-object --bucket "$$bucket" --key config/prices.json 2>/dev/null; then
          echo "prices.json already present"
        else
          echo '{"currency":"USD","items":{"widget":{"unit_price_cents":1999},"gadget":{"unit_price_cents":4550}}}' \
            | aws --endpoint-url "$$endpoint" s3 cp - "s3://$$bucket/config/prices.json"
        fi
        echo "bucket ready: $$bucket"

  s3-put:
    image: amazon/aws-cli:2.31.9
    profiles: ["smoke"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: pmt-bucket
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        aws --endpoint-url http://seaweedfs:8333 s3 cp - "s3://$$BUCKET/$$KEY"
        aws --endpoint-url http://seaweedfs:8333 s3api head-object --bucket "$$BUCKET" --key "$$KEY" >/dev/null
        echo "uploaded s3://$$BUCKET/$$KEY"

volumes:
  pmt_pgdata:
  seaweeddata:
